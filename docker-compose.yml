# Xencode (Rust) — single-service compose for the collaboration server.
# The legacy observability stack (postgres/redis/nginx/prometheus/ELK) served
# the old Python API and was already broken (missing init-db.sql, nginx/,
# grafana/ dirs); the Rust server is stateless, so it is not carried over.
services:
  # Main Xencode Application (xencode server)
  xencode-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: xencode-app
    ports:
      - "8765:8765"
    environment:
      - XENCODE_ENV=production
      - LOG_LEVEL=INFO
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - xencode-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  xencode-network:
    driver: bridge
