[workspace]
members = [
    "crates/xencode-core-rs",
    "crates/xencode-config-rs",
    "crates/xencode-live-rs",
    "crates/xencode-context-rs",
    "crates/xencode-cache-rs",
    "crates/xencode-models-rs",
    "crates/xencode-memory-rs",
    "crates/xencode-providers-rs",
    "crates/xencode-mcp-rs",
    "crates/xencode-tui-rs",
    "crates/xencode-acp-rs",
    "crates/xencode-team-rs",
    "crates/xencode-analysis-rs",
    "crates/xencode-cli",
    "crates/xencode-server-rs",
    "crates/xencode-collaboration-rs",
    "crates/xencode-plugin-rs",
    "crates/xencode-colab-rs",
    "crates/xencode-agents-rs",
]
# The floating badge is its own workspace, so this one and its CI never
# build the GPU interface library it uses.
exclude = ["badge"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Keep `target/` from eating the disk. Full debug info in every dependency is
# what made it grow: one working day of builds and test runs reached 90 GiB, 71
# of it in `target/debug/deps` (measured 2026-10-08). Line tables keep file and
# line in panics and backtraces for our own crates; dependencies carry none.
# A session that needs a real debugger on xencode itself can override this
# with `CARGO_PROFILE_DEV_DEBUG=true`.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
