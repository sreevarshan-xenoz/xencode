[workspace]
resolver = "2"
members = [
    "crates/xencode-core-rs",
    "crates/xencode-config-rs",
    "crates/xencode-cache-rs",
    "crates/xencode-memory-rs",
    "crates/xencode-models-rs",
    "crates/xencode-providers-rs",
    "crates/xencode-tui-rs",
    "crates/xencode-cli",
    "crates/xencode-analysis-rs",
    "crates/xencode-server-rs",
    "crates/xencode-collaboration-rs",
    "crates/xencode-plugin-rs",
]

[workspace.package]
version = "2.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
ratatui = "0.26"
crossterm = "0.27"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
axum = { version = "0.7", features = ["ws", "json"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio", "chrono"] }
jsonwebtoken = "9"
sha2 = "0.10"
hex = "0.4"
futures = "0.3"
dirs = "5"
