[package]
name = "xencode-tui-rs"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "xencode_tui_rs"
path = "src/lib.rs"

[dependencies]
xencode-models-rs = { path = "../xencode-models-rs" }
xencode-providers-rs = { path = "../xencode-providers-rs" }
xencode-memory-rs = { path = "../xencode-memory-rs" }
xencode-config-rs = { path = "../xencode-config-rs" }
xencode-core-rs = { path = "../xencode-core-rs" }
xencode-context-rs = { path = "../xencode-context-rs" }
xencode-mcp-rs = { path = "../xencode-mcp-rs" }
xencode-plugin-rs = { path = "../xencode-plugin-rs" }
xencode-analysis-rs = { path = "../xencode-analysis-rs" }
xencode-colab-rs = { path = "../xencode-colab-rs" }
xencode-collaboration-rs = { path = "../xencode-collaboration-rs" }
xencode-agents-rs = { path = "../xencode-agents-rs" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
crossterm = "0.28"
ratatui = "0.29"
tui-textarea = "0.7"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
libc = "0.2"
similar = "2"
regex = "1"
rmcp = { version = "3.5.0", default-features = false, features = ["server", "transport-io"] }

