[package]
name = "xencode-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository = "https://github.com/sreevarshan-xenoz/xencode"

[[bin]]
name = "xencode"
path = "src/main.rs"

[dependencies]
xencode-agents-rs = { path = "../xencode-agents-rs" }
xencode-core-rs = { path = "../xencode-core-rs" }
xencode-config-rs = { path = "../xencode-config-rs" }
xencode-live-rs = { path = "../xencode-live-rs" }
xencode-cache-rs = { path = "../xencode-cache-rs" }
xencode-models-rs = { path = "../xencode-models-rs" }
xencode-memory-rs = { path = "../xencode-memory-rs" }
xencode-providers-rs = { path = "../xencode-providers-rs" }
xencode-tui-rs = { path = "../xencode-tui-rs" }
xencode-server-rs = { path = "../xencode-server-rs" }
xencode-collaboration-rs = { path = "../xencode-collaboration-rs" }
xencode-plugin-rs = { path = "../xencode-plugin-rs" }
xencode-analysis-rs = { path = "../xencode-analysis-rs" }
xencode-context-rs = { path = "../xencode-context-rs" }
xencode-mcp-rs = { path = "../xencode-mcp-rs" }
xencode-colab-rs = { path = "../xencode-colab-rs" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
tempfile = "3"
serde_json = "1"
tokio = { version = "1", features = ["full", "rt-multi-thread"] }
crossterm = "0.28"
ratatui = "0.29"
walkdir = "2"
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls"] }

[dev-dependencies]
tempfile = "3"
