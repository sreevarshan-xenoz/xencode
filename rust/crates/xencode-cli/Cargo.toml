[package]
name = "xencode-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "xencode"
path = "src/main.rs"

[dependencies]
xencode-core-rs = { path = "../xencode-core-rs" }
xencode-config-rs = { path = "../xencode-config-rs" }
xencode-cache-rs = { path = "../xencode-cache-rs" }
xencode-models-rs = { path = "../xencode-models-rs" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
