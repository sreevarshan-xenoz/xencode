[package]
name = "xencode-memory-rs"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "xencode_memory_rs"
path = "src/lib.rs"

[dependencies]
xencode-config-rs = { path = "../xencode-config-rs" }
xencode-context-rs = { path = "../xencode-context-rs" }
xencode-core-rs = { path = "../xencode-core-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
