[package]
name = "xencode-models-rs"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "xencode_models_rs"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
