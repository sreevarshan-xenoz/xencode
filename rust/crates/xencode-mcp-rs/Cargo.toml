[package]
name = "xencode-mcp-rs"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "xencode_mcp_rs"
path = "src/lib.rs"

[dependencies]
futures-util = "0.3"
reqwest = { version = "0.13", features = ["json", "stream"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "time", "sync"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
