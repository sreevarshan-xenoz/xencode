[package]
name = "xencode-team-rs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "A team of worker agents for xencode: worktrees, ACP workers, the checked merge (TM)"
publish = false

[dependencies]
agent-client-protocol = { version = "=3.3.0", features = ["process"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[dev-dependencies]
tempfile = "3"
