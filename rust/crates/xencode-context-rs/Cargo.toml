[package]
name = "xencode-context-rs"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "xencode_context_rs"
path = "src/lib.rs"

[dependencies]
xencode-core-rs = { path = "../xencode-core-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
# The symbol tier parses Rust instead of pattern-matching its text. Both halves are
# pinned together: a grammar built for an older runtime ABI is refused at
# `set_language`, and that failure is only visible at run time.
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
sha2 = "0.10"
notify = "8"
pdf-extract = "0.12.1"
zip = "8.6.0"
libc = "0.2"
chrono = "0.4"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3"

[[bench]]
name = "hot_paths"
harness = false
