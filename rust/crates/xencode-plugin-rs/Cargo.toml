[package]
name = "xencode-plugin-rs"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["sync"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
