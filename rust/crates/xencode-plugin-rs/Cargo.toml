[package]
name = "xencode-plugin-rs"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["sync"] }
thiserror = "2"
tracing = "0.1"
# A git install is a temporary checkout, and an update is shown as a diff before
# it is applied. Both are product behaviour, not test scaffolding.
tempfile = "3"
similar = "2"

[dev-dependencies]
tempfile = "3"
