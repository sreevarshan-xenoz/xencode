[package]
name = "xencode-core-rs"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "xencode_core_rs"
path = "src/lib.rs"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "time"] }
