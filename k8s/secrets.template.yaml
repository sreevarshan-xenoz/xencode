apiVersion: v1
kind: Secret
metadata:
  name: xencode-secrets
  namespace: xencode
type: Opaque
stringData:
  database-url: ${DATABASE_URL}
  redis-url: ${REDIS_URL}
  jwt-secret: ${JWT_SECRET_KEY}

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: xencode
type: Opaque
stringData:
  username: ${POSTGRES_USERNAME}
  password: ${POSTGRES_PASSWORD}
