[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=xencode",
    "--cov=xencode_core",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "-ra",
    "--asyncio-mode=auto",
]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "security: marks tests as security tests",
    "e2e: marks tests as end-to-end tests",
    "perf: marks tests as performance tests",
    "asyncio: marks tests as async tests",
]

[tool.coverage.run]
source = ["xencode", "xencode_core"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/__pycache__/*",
    "*/.*",
    "setup.py",
    "scripts/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
strict_optional = true

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C4",  # flake8-comprehensions (excludes C901 complexity checks)
    "B",  # flake8-bugbear
    "S604",  # subprocess-shell-true — prevent shell=True regressions
]
ignore = [
    "E501",  # Line too long (handled by black)
    "W291",  # Trailing whitespace (bulk of occurrences live inside string literals/prompts)
    "W293",  # Blank line contains whitespace (same string-literal reason)
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Security",
    "fastapi.params.Depends",
    "fastapi.params.Query",
    "fastapi.params.Path",
    "fastapi.params.Body",
    "fastapi.params.Header",
    "fastapi.params.Cookie",
    "fastapi.params.File",
    "fastapi.params.Form",
    "fastapi.params.Security",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]

[tool.black]
line-length = 88
target-version = ['py38']
skip-string-normalization = true

[tool.bandit]
# Bandit security scanner configuration
exclude_dirs = ["tests", ".venv", "venv", "__pycache__", "node_modules", "build", "dist"]
skips = ["B101", "B311", "B320"]
level = "MEDIUM"
