name: Xencode CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'rust/**'
      - 'Dockerfile'
      - 'scripts/**'
      - 'k8s/**'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  rust:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache Cargo registry and build
      uses: actions/cache@v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          rust/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Check formatting
      run: cargo fmt --check
      working-directory: rust

    - name: Run clippy lints
      run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::format-in-format-args
      working-directory: rust

    - name: Run cargo test
      run: cargo test --workspace --verbose
      working-directory: rust

  build-and-push:
    runs-on: ubuntu-latest
    needs: rust
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1

    - name: Log in to Container Registry
      uses: docker/login-action@v4.6.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6.2.0
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3.12.0

    - name: Build and push Docker image
      uses: docker/build-push-action@v7.3.0
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    environment: staging
    env:
      HAS_STAGING_SECRETS: ${{ secrets.KUBE_CONFIG_STAGING != '' && secrets.DATABASE_URL_STAGING != '' && secrets.REDIS_URL_STAGING != '' && secrets.JWT_SECRET_KEY_STAGING != '' && secrets.POSTGRES_USERNAME_STAGING != '' && secrets.POSTGRES_PASSWORD_STAGING != '' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1

    - name: Configure kubectl
      if: env.HAS_STAGING_SECRETS == 'true'
      uses: azure/k8s-set-context@v5.0.1
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

    - name: Validate deployment secrets
      if: env.HAS_STAGING_SECRETS == 'true'
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
        REDIS_URL: ${{ secrets.REDIS_URL_STAGING }}
        JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY_STAGING }}
        POSTGRES_USERNAME: ${{ secrets.POSTGRES_USERNAME_STAGING }}
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD_STAGING }}
      run: |
        for v in DATABASE_URL REDIS_URL JWT_SECRET_KEY POSTGRES_USERNAME POSTGRES_PASSWORD; do
          test -n "${!v}" || { echo "❌ $v is empty"; exit 1; }
        done
        echo "✅ staging secrets present"

    - name: Render Kubernetes secrets
      if: env.HAS_STAGING_SECRETS == 'true'
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
        REDIS_URL: ${{ secrets.REDIS_URL_STAGING }}
        JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY_STAGING }}
        POSTGRES_USERNAME: ${{ secrets.POSTGRES_USERNAME_STAGING }}
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD_STAGING }}
      run: |
        sudo apt-get update && sudo apt-get install -y gettext-base
        envsubst < k8s/secrets.template.yaml > k8s/secrets.generated.yaml

    - name: Deploy to staging
      if: env.HAS_STAGING_SECRETS == 'true'
      run: |
        kubectl create namespace xencode --dry-run=client -o yaml | kubectl apply -f -
        kubectl apply -f k8s/secrets.generated.yaml
        kubectl apply -f k8s/postgres.yaml
        kubectl apply -f k8s/deployment.yaml
        kubectl set image deployment/xencode-app xencode-app=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop -n xencode
        kubectl rollout status deployment/xencode-app -n xencode

    - name: Run smoke tests
      if: env.HAS_STAGING_SECRETS == 'true'
      run: |
        kubectl wait --for=condition=ready pod -l app=xencode -n xencode --timeout=300s
        # Add smoke test commands here

  deploy-production:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: production
    env:
      HAS_PRODUCTION_SECRETS: ${{ secrets.KUBE_CONFIG_PRODUCTION != '' && secrets.DATABASE_URL_PRODUCTION != '' && secrets.REDIS_URL_PRODUCTION != '' && secrets.JWT_SECRET_KEY_PRODUCTION != '' && secrets.POSTGRES_USERNAME_PRODUCTION != '' && secrets.POSTGRES_PASSWORD_PRODUCTION != '' }}
      HAS_SLACK: ${{ secrets.SLACK_WEBHOOK != '' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1

    - name: Configure kubectl
      if: env.HAS_PRODUCTION_SECRETS == 'true'
      uses: azure/k8s-set-context@v5.0.1
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

    - name: Validate deployment secrets
      if: env.HAS_PRODUCTION_SECRETS == 'true'
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        REDIS_URL: ${{ secrets.REDIS_URL_PRODUCTION }}
        JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY_PRODUCTION }}
        POSTGRES_USERNAME: ${{ secrets.POSTGRES_USERNAME_PRODUCTION }}
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD_PRODUCTION }}
      run: |
        for v in DATABASE_URL REDIS_URL JWT_SECRET_KEY POSTGRES_USERNAME POSTGRES_PASSWORD; do
          test -n "${!v}" || { echo "❌ $v is empty"; exit 1; }
        done
        echo "✅ production secrets present"

    - name: Render Kubernetes secrets
      if: env.HAS_PRODUCTION_SECRETS == 'true'
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        REDIS_URL: ${{ secrets.REDIS_URL_PRODUCTION }}
        JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY_PRODUCTION }}
        POSTGRES_USERNAME: ${{ secrets.POSTGRES_USERNAME_PRODUCTION }}
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD_PRODUCTION }}
      run: |
        sudo apt-get update && sudo apt-get install -y gettext-base
        envsubst < k8s/secrets.template.yaml > k8s/secrets.generated.yaml

    - name: Deploy to production
      if: env.HAS_PRODUCTION_SECRETS == 'true'
      run: |
        kubectl create namespace xencode --dry-run=client -o yaml | kubectl apply -f -
        kubectl apply -f k8s/secrets.generated.yaml
        kubectl apply -f k8s/postgres.yaml
        kubectl apply -f k8s/deployment.yaml
        kubectl set image deployment/xencode-app xencode-app=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest -n xencode
        kubectl rollout status deployment/xencode-app -n xencode

    - name: Run production health checks
      if: env.HAS_PRODUCTION_SECRETS == 'true'
      run: |
        kubectl wait --for=condition=ready pod -l app=xencode -n xencode --timeout=300s
        # Add production health check commands here

    - name: Notify deployment
      uses: 8398a7/action-slack@v3.19.0
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      if: always() && (env.HAS_SLACK == 'true')

  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v4.37.9
      with:
        sarif_file: 'trivy-results.sarif'