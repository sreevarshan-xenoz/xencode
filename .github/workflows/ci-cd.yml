name: Xencode CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  collect-only:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up Python
      uses: actions/setup-python@v7.0.0
      with:
        python-version: 3.11

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio

    - name: Collect tests
      run: |
        python -m pytest tests --collect-only -q -p no:cacheprovider

  quality:
    runs-on: ubuntu-latest
    needs: collect-only

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up Python
      uses: actions/setup-python@v7.0.0
      with:
        python-version: 3.11

    - name: Install quality dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit pip-audit
        pip install ruff

    - name: Validate version consistency
      run: |
        python scripts/check_version_consistency.py

    - name: Run linting
      run: |
        ruff check xencode/ tests/

    - name: Run security checks
      run: |
        bandit -r xencode/ -f json -o bandit-report.json || true
        pip-audit -r requirements.txt || true

  marker-tests:
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        python-version: [3.10, 3.11]
        marker: [unit, integration, e2e, security, perf]

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio

    - name: Collect marker tests
      id: collect-marker
      shell: bash
      run: |
        set +e
        python -m pytest tests -m "${{ matrix.marker }}" --collect-only -q -p no:cacheprovider
        status=$?
        set -e

        if [ "$status" -eq 5 ]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "No tests found for marker '${{ matrix.marker }}'. Skipping execution."
          exit 0
        fi

        if [ "$status" -ne 0 ]; then
          echo "Marker collection failed for '${{ matrix.marker }}'"
          exit "$status"
        fi

        echo "skip=false" >> "$GITHUB_OUTPUT"

    - name: Run marker tests
      if: steps.collect-marker.outputs.skip == 'false'
      run: |
        python -m pytest tests -m "${{ matrix.marker }}" -v --cov=xencode --cov-report=xml -p no:cacheprovider

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7.0.0
      with:
        files: ./coverage.xml
        flags: ${{ matrix.marker }}
        name: codecov-umbrella

  build-and-push:
    runs-on: ubuntu-latest
    needs: marker-tests
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1

    - name: Log in to Container Registry
      uses: docker/login-action@v4.6.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6.2.0
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7.3.0
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    environment: staging
    env:
      HAS_STAGING_SECRETS: ${{ secrets.KUBE_CONFIG_STAGING != '' && secrets.DATABASE_URL_STAGING != '' && secrets.REDIS_URL_STAGING != '' && secrets.JWT_SECRET_KEY_STAGING != '' && secrets.POSTGRES_USERNAME_STAGING != '' && secrets.POSTGRES_PASSWORD_STAGING != '' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1

    - name: Configure kubectl
      if: env.HAS_STAGING_SECRETS == 'true'
      uses: azure/k8s-set-context@v5.0.1
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

    - name: Validate deployment secrets
      if: env.HAS_STAGING_SECRETS == 'true'
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
        REDIS_URL: ${{ secrets.REDIS_URL_STAGING }}
        JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY_STAGING }}
        POSTGRES_USERNAME: ${{ secrets.POSTGRES_USERNAME_STAGING }}
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD_STAGING }}
      run: |
        python scripts/validate_deploy_secrets.py --environment staging

    - name: Render Kubernetes secrets
      if: env.HAS_STAGING_SECRETS == 'true'
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
        REDIS_URL: ${{ secrets.REDIS_URL_STAGING }}
        JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY_STAGING }}
        POSTGRES_USERNAME: ${{ secrets.POSTGRES_USERNAME_STAGING }}
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD_STAGING }}
      run: |
        sudo apt-get update && sudo apt-get install -y gettext-base
        envsubst < k8s/secrets.template.yaml > k8s/secrets.generated.yaml

    - name: Deploy to staging
      if: env.HAS_STAGING_SECRETS == 'true'
      run: |
        kubectl create namespace xencode --dry-run=client -o yaml | kubectl apply -f -
        kubectl apply -f k8s/secrets.generated.yaml
        kubectl apply -f k8s/postgres.yaml
        kubectl apply -f k8s/deployment.yaml
        kubectl set image deployment/xencode-app xencode-app=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop -n xencode
        kubectl rollout status deployment/xencode-app -n xencode

    - name: Run smoke tests
      if: env.HAS_STAGING_SECRETS == 'true'
      run: |
        kubectl wait --for=condition=ready pod -l app=xencode -n xencode --timeout=300s
        # Add smoke test commands here

  deploy-production:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: production
    env:
      HAS_PRODUCTION_SECRETS: ${{ secrets.KUBE_CONFIG_PRODUCTION != '' && secrets.DATABASE_URL_PRODUCTION != '' && secrets.REDIS_URL_PRODUCTION != '' && secrets.JWT_SECRET_KEY_PRODUCTION != '' && secrets.POSTGRES_USERNAME_PRODUCTION != '' && secrets.POSTGRES_PASSWORD_PRODUCTION != '' }}
      HAS_SLACK: ${{ secrets.SLACK_WEBHOOK != '' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1

    - name: Configure kubectl
      if: env.HAS_PRODUCTION_SECRETS == 'true'
      uses: azure/k8s-set-context@v5.0.1
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

    - name: Validate deployment secrets
      if: env.HAS_PRODUCTION_SECRETS == 'true'
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        REDIS_URL: ${{ secrets.REDIS_URL_PRODUCTION }}
        JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY_PRODUCTION }}
        POSTGRES_USERNAME: ${{ secrets.POSTGRES_USERNAME_PRODUCTION }}
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD_PRODUCTION }}
      run: |
        python scripts/validate_deploy_secrets.py --environment production

    - name: Render Kubernetes secrets
      if: env.HAS_PRODUCTION_SECRETS == 'true'
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        REDIS_URL: ${{ secrets.REDIS_URL_PRODUCTION }}
        JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY_PRODUCTION }}
        POSTGRES_USERNAME: ${{ secrets.POSTGRES_USERNAME_PRODUCTION }}
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD_PRODUCTION }}
      run: |
        sudo apt-get update && sudo apt-get install -y gettext-base
        envsubst < k8s/secrets.template.yaml > k8s/secrets.generated.yaml

    - name: Deploy to production
      if: env.HAS_PRODUCTION_SECRETS == 'true'
      run: |
        kubectl create namespace xencode --dry-run=client -o yaml | kubectl apply -f -
        kubectl apply -f k8s/secrets.generated.yaml
        kubectl apply -f k8s/postgres.yaml
        kubectl apply -f k8s/deployment.yaml
        kubectl set image deployment/xencode-app xencode-app=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest -n xencode
        kubectl rollout status deployment/xencode-app -n xencode

    - name: Run production health checks
      if: env.HAS_PRODUCTION_SECRETS == 'true'
      run: |
        kubectl wait --for=condition=ready pod -l app=xencode -n xencode --timeout=300s
        # Add production health check commands here

    - name: Notify deployment
      uses: 8398a7/action-slack@v3.19.0
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      if: always() && (env.HAS_SLACK == 'true')

  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'