name: Xencode CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio

    - name: Validate version consistency
      run: python scripts/check_version_consistency.py

    - name: Collect tests
      run: python -m pytest tests --collect-only -q -p no:cacheprovider

    - name: Lint with ruff
      run: |
        pip install ruff
        ruff check xencode/ tests/

    - name: Test with pytest
      run: python -m pytest tests/ -v --cov=xencode --cov-report=xml -p no:cacheprovider

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7.0.0
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  rust-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache Cargo registry and build
      uses: actions/cache@v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          rust/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Check formatting
      run: cargo fmt --check
      working-directory: rust

    - name: Run clippy lints
      run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::format-in-format-args
      working-directory: rust

    - name: Run cargo test
      run: cargo test --workspace --verbose
      working-directory: rust

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up Python
      uses: actions/setup-python@v7.0.0
      with:
        python-version: "3.11"

    - name: Run Bandit security scan
      run: |
        pip install bandit
        bandit -r xencode/ -f json -o bandit-report.json || true

    - name: Run pip-audit check
      run: |
        pip install pip-audit
        pip-audit -r requirements.txt || true
