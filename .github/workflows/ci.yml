name: Xencode CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  rust-tests:
    # Pinned to Ubuntu 24.04: since ubuntu-latest moved to Ubuntu 26 (2026-10-19)
    # the test suite starves the runner until GitHub reports "lost communication",
    # on commits that passed before the move as well. See RH-13 in NEXT_PLAN_TASKS.md.
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy, rust-analyzer

    - name: Cache Cargo registry and build
      uses: actions/cache@v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          rust/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Check formatting
      run: cargo fmt --check
      working-directory: rust

    - name: Run clippy lints
      run: cargo clippy --workspace --all-targets -- -D warnings
      working-directory: rust

    - name: Run cargo test
      run: cargo test --workspace --no-fail-fast
      working-directory: rust

    - name: Check generated completions and man page are current
      run: |
        cargo build --manifest-path rust/Cargo.toml -p xencode-cli
        ./rust/target/debug/xencode generate completions --shell fish > docs/completions/xencode.fish
        ./rust/target/debug/xencode generate completions --shell zsh > docs/completions/xencode.zsh
        ./rust/target/debug/xencode generate completions --shell bash > docs/completions/xencode.bash
        ./rust/target/debug/xencode generate man > docs/man/xencode.1
        git diff --exit-code -- docs/completions docs/man
      working-directory: .

  coverage:
    # Line coverage of the whole workspace. The floor is set below the 82.8%
    # measured on Linux on 2026-10-26, so a change that drops it noticeably
    # fails here; raise it when coverage rises.
    # Pinned to Ubuntu 24.04: since ubuntu-latest moved to Ubuntu 26 (2026-10-19)
    # the test suite starves the runner until GitHub reports "lost communication",
    # on commits that passed before the move as well. See RH-13 in NEXT_PLAN_TASKS.md.
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview

    - name: Cache Cargo registry and build
      uses: actions/cache@v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cargo/bin/cargo-llvm-cov
          rust/target
        key: ${{ runner.os }}-coverage-${{ hashFiles('rust/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-coverage-

    - name: Install cargo-llvm-cov
      run: command -v cargo-llvm-cov || cargo install cargo-llvm-cov --version 0.9.1 --locked

    - name: Measure line coverage
      run: |
        cargo llvm-cov --workspace --lcov --output-path lcov.info
        cargo llvm-cov report --summary-only --fail-under-lines 80
      working-directory: rust

    - name: Keep the coverage report
      uses: actions/upload-artifact@v7.0.2
      with:
        name: lcov
        path: rust/lcov.info

  secret-scan:
    # gitleaks over every commit in the history. Deliberately fake test keys
    # are allowed by .gitleaks.toml, and past findings checked by hand are
    # listed in .gitleaksignore; anything else fails the job.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0

    - name: Install gitleaks
      env:
        GITLEAKS_VERSION: 8.30.1
      run: |
        cd "$RUNNER_TEMP"
        curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sha256sum -c -
        tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks

    - name: Scan the history for secrets
      run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner -c .gitleaks.toml .'

  windows-build:
    # Windows is a release target, and from 2026-10-01 to 2026-10-08 it did not
    # compile without anyone noticing, because every other job runs on Linux.
    # This job only proves that every target, tests included, still builds there
    # without warnings. It does not run the tests: some still fail on Windows for
    # the reasons listed under PL-2 in NEXT_PLAN_TASKS.md.
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo registry and build
      uses: actions/cache@v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          rust/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Build every target, tests included
      run: cargo build --workspace --all-targets
      working-directory: rust
      env:
        RUSTFLAGS: -D warnings

  badge:
    # The floating badge (DK-2) is its own Cargo workspace under rust/badge, so
    # the jobs above never build its GPU interface library. This job proves it
    # builds, and runs its tests, on the two desktop platforms it ships for.
    # macOS has only ever been built here, never watched running on a Mac.
    name: badge (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo registry and build
      uses: actions/cache@v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          rust/badge/target
        key: ${{ runner.os }}-badge-${{ hashFiles('rust/badge/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-badge-

    - name: Build and test the badge
      run: |
        cargo build
        cargo test
      working-directory: rust/badge
