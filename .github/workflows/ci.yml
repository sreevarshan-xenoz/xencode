name: Xencode CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  rust-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy, rust-analyzer

    - name: Cache Cargo registry and build
      uses: actions/cache@v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          rust/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Check formatting
      run: cargo fmt --check
      working-directory: rust

    - name: Run clippy lints
      run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::format-in-format-args
      working-directory: rust

    - name: Run cargo test
      run: cargo test --workspace --no-fail-fast
      working-directory: rust

    - name: Check generated completions and man page are current
      run: |
        cargo build -p xencode-cli
        ./target/debug/xencode generate completions --shell fish > docs/completions/xencode.fish
        ./target/debug/xencode generate completions --shell zsh > docs/completions/xencode.zsh
        ./target/debug/xencode generate completions --shell bash > docs/completions/xencode.bash
        ./target/debug/xencode generate man > docs/man/xencode.1
        git diff --exit-code -- docs/completions docs/man
      working-directory: .

  windows-build:
    # Windows is a release target, and from 2026-10-01 to 2026-10-08 it did not
    # compile without anyone noticing, because every other job runs on Linux.
    # This job only proves that every target, tests included, still builds there
    # without warnings. It does not run the tests: some still fail on Windows for
    # the reasons listed under PL-2 in NEXT_PLAN_TASKS.md.
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo registry and build
      uses: actions/cache@v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          rust/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Build every target, tests included
      run: cargo build --workspace --all-targets
      working-directory: rust
      env:
        RUSTFLAGS: -D warnings
