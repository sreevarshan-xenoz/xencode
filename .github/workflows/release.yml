name: Xencode Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo registry and build
      uses: actions/cache@v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          rust/target
        key: ${{ runner.os }}-cargo-release-${{ hashFiles('rust/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-release-
          ${{ runner.os }}-cargo-

    - name: Build release binary
      run: cargo build --release -p xencode-cli
      working-directory: rust

    - name: Smoke-test release binary
      run: ./scripts/smoke-test.sh ./rust/target/release/xencode

    - name: Publish GitHub Release with binary
      uses: softprops/action-gh-release@v2.3.2
      with:
        files: rust/target/release/xencode
        generate_release_notes: true
